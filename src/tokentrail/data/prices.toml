# tokentrail price table — data, not code.
#
# USD per million tokens, Anthropic first-party API rates.
# To change it, run `tokentrail prices --init`, which copies this file to
# tokentrail's data directory; your copy then wins over this one.
#
# Cache writes: 1.25x input for the 5-minute TTL, 2x for the 1-hour TTL.
# Cache reads differ by model and are listed per model.
#
# On a Pro/Max subscription you are not billed per token. These prices are
# still the best common unit for comparing where your limits go.

verified_on = 2026-09-25
source = "Anthropic model and pricing reference (as bundled with Claude Code 2.1.288). Re-check against https://claude.com/pricing"

[cache_write_multiplier]
"5m" = 1.25
"1h" = 2.0

# Model ids are matched by longest prefix, so "claude-haiku-4-5" also
# prices "claude-haiku-4-5-20251001".
# max_output = the model's output cap per call, used for the estimate's ceiling.

[models."claude-fable-5-1"]
input = 10.00
output = 50.00
cache_read = 0.25
max_output = 128000

[models."claude-mythos-5-1"]
input = 10.00
output = 50.00
cache_read = 0.25
max_output = 128000

